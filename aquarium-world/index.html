<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c2a6a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aquarium">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Aquarium World</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 0 2px #1a2340,0 0 40px #0a1a40}
  #touch{display:none;width:100%;max-width:520px;height:150px;position:relative;flex:none}
  body.touch #touch{display:block}
  .tb{position:absolute;background:#1c2850;border:2px solid #6a80c0;color:#dfe6ff;font:bold 16px monospace;
      display:flex;align-items:center;justify-content:center;border-radius:10px;opacity:.85}
  .tb.on{background:#3a5aa0}
  #dpad{position:absolute;left:8px;top:4px;width:150px;height:142px;touch-action:none}
  #dpad .tb{pointer-events:none}
  #nameInput{position:fixed;display:none;z-index:5;box-sizing:border-box;border:0;outline:none;padding:0;margin:0;
      background:transparent;color:transparent;caret-color:transparent;font-size:16px;-webkit-user-select:text;user-select:text}
  .overlay{position:fixed;display:none;z-index:5;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
  #help{color:#7f8fbf;font:12px monospace;margin-top:8px;text-align:center}
  body.touch #help{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="320" height="240"></canvas>
  <div id="help">Arrows/WASD: move &nbsp; Z/Enter/Space: confirm &nbsp; X/Backspace: cancel (hold to run) &nbsp; Esc/M: menu</div>
  <div id="touch">
    <div id="dpad">
      <div class="tb" data-d="up"    style="left:50px;top:2px;width:50px;height:44px">&#9650;</div>
      <div class="tb" data-d="left"  style="left:0;top:48px;width:50px;height:44px">&#9664;</div>
      <div class="tb" data-d="right" style="left:100px;top:48px;width:50px;height:44px">&#9654;</div>
      <div class="tb" data-d="down"  style="left:50px;top:94px;width:50px;height:44px">&#9660;</div>
    </div>
    <div class="tb" data-k="b"     style="right:96px;top:70px;width:62px;height:62px;border-radius:50%">B</div>
    <div class="tb" data-k="a"     style="right:16px;top:30px;width:70px;height:70px;border-radius:50%">A</div>
    <div class="tb" data-k="menu"  style="right:110px;top:10px;width:64px;height:34px">MENU</div>
  </div>
</div>
<input id="nameInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-label="Name">
<input id="fileInput" class="overlay" type="file" accept=".json,application/json,text/plain" aria-label="Load a save file">
<button id="exportBtn" class="overlay" type="button" aria-label="Save this slot to a file"></button>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/field.js"></script>
<script src="js/fishing.js"></script>
<script src="js/main.js"></script>
</body>
</html>
