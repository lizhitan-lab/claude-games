<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aquarium World</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 0 2px #1a2340,0 0 40px #0a1a40}
  #touch{display:none;width:100%;max-width:520px;height:150px;position:relative;flex:none}
  body.touch #touch{display:block}
  .tb{position:absolute;background:#1c2850;border:2px solid #6a80c0;color:#dfe6ff;font:bold 16px monospace;
      display:flex;align-items:center;justify-content:center;border-radius:10px;opacity:.85}
  .tb.on{background:#3a5aa0}
  #help{color:#7f8fbf;font:12px monospace;margin-top:8px;text-align:center}
  body.touch #help{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="320" height="240"></canvas>
  <div id="help">Arrows/WASD: move &nbsp; Z/Enter/Space: confirm &nbsp; X/Backspace: cancel (hold to run) &nbsp; Esc/M: menu</div>
  <div id="touch">
    <div class="tb" data-k="up"    style="left:62px;top:8px;width:50px;height:44px">&#9650;</div>
    <div class="tb" data-k="left"  style="left:10px;top:52px;width:50px;height:44px">&#9664;</div>
    <div class="tb" data-k="right" style="left:114px;top:52px;width:50px;height:44px">&#9654;</div>
    <div class="tb" data-k="down"  style="left:62px;top:96px;width:50px;height:44px">&#9660;</div>
    <div class="tb" data-k="b"     style="right:96px;top:70px;width:62px;height:62px;border-radius:50%">B</div>
    <div class="tb" data-k="a"     style="right:16px;top:30px;width:70px;height:70px;border-radius:50%">A</div>
    <div class="tb" data-k="menu"  style="right:110px;top:10px;width:64px;height:34px">MENU</div>
  </div>
</div>
<script src="js/engine.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/field.js"></script>
<script src="js/fishing.js"></script>
<script src="js/main.js"></script>
</body>
</html>
