<title>Joshin's Birthday Arcade</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Patrick+Hand&display=swap">
<style>
  /* Single look: crayon-doodle party sky, full-screen letterboxed canvas */
  :root { --sky: #6fc0ec; --ink: #1d2b5c; color-scheme: light; }
  html, body { height: 100%; margin: 0; background: var(--sky); overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; }
  #box { position: relative; width: 100%; height: 100%; display: grid; grid-template-areas: "S"; grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #stage { grid-area: S; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  canvas { display: block; touch-action: none; border-radius: 6px; outline: none; }
  /* touch control pads sit outside the game picture */
  .pad { display: none; box-sizing: border-box; padding: 10px; gap: 12px; align-items: center; justify-content: center; }
  #padL { grid-area: L; } #padR { grid-area: R; }
  #box.land { grid-template-areas: "L S R"; grid-template-columns: auto 1fr auto; }
  #box.port { grid-template-areas: "S S" "L R"; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; }
  #box.land .pad, #box.port .pad { display: flex; }
  #box.land .pad { width: clamp(140px, 22vw, 250px); height: 100%; }
  #box.port .pad { height: clamp(180px, 38vh, 340px); }
  .cbtn { flex: 1 1 0; min-width: 0; height: min(100%, 230px); max-width: 230px; border: 4px solid var(--ink); border-radius: 30px;
    background: #fff8e8; color: var(--ink); box-shadow: 0 7px 0 var(--ink); font: 800 clamp(22px, 4.5vmin, 40px)/1 "Baloo 2", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-user-select: none; user-select: none; padding: 0; }
  .cbtn.jump { background: #ff6b8b; color: #fff; text-shadow: 0 3px 0 var(--ink); }
  .cbtn.slide { background: #ffd23f; }
  .cbtn svg { width: 46%; height: auto; max-height: 60%; }
  .cbtn.on { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink); filter: brightness(.93); }
  #loading { position: absolute; color: var(--ink); font: 700 22px "Baloo 2", system-ui, sans-serif; }
</style>
<div id="wrap"><div id="box"><div class="pad" id="padL"></div><div id="stage"><canvas id="c" tabindex="0" aria-label="Joshin's Birthday Arcade game"></canvas><div id="loading">Loading the party…</div></div><div class="pad" id="padR"></div></div></div>
<script>
"use strict";
// ================= basics =================
let W = 960, H = 540, PORT = false; // logical size: 960x540 landscape, 540 wide and taller in portrait
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#1d2b5c', PINK = '#ff2e78', PAPER = '#fff8e8', BANNER = '#f7e3a1';
const FT = '"Baloo 2", system-ui, sans-serif', FB = '"Patrick Hand", "Comic Sans MS", system-ui, sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('jb_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('jb_' + k, JSON.stringify(v)); } catch (e) {} }
};

function resize() {
  layoutPads();
  const box = document.getElementById('stage'), cw = box.clientWidth || 960, chh = box.clientHeight || 540;
  if (chh >= cw) { PORT = true; W = 540; H = clamp(Math.round(540 * chh / cw), 540, 1200); }
  else { PORT = false; W = 960; H = 540; }
  const s = Math.min(cw / W, chh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize);

// ================= friends =================
const FRIENDS = [
  ['isaac', 'Isaac', 'the spiky black crown hair'],
  ['josiah', 'Josiah', 'the blue hat'],
  ['brandon', 'Brandon', 'the reindeer antlers'],
  ['jaytzen', 'Jay Tzen', 'the purple striped shirt'],
  ['olivia', 'Olivia', 'the brown side ponytail'],
  ['jaytzen_sister', "Jay Tzen's sister", 'the two pointy black pigtails'],
  ['oliver', 'Oliver', 'the super tall blue hat'],
  ['kaile', 'Kaile', 'the pink shirt and brown hair'],
  ['yaning', 'Yaning', 'the big black puffy pigtails'],
  ['chloe', 'Chloe', 'the little red hair clip'],
  ['lavain', 'Lavain', 'the big round black hair'],
  ['nathaneil', 'Nathaneil', 'the big toothy grin'],
  ['natanya', 'Natanya', 'the black hair swoop'],
  ['jacob', 'Jacob', 'the headband'],
  ['jayden', 'Jayden', 'the striped beanie with a pom-pom'],
  ['jayden_sister', "Jayden's sister", 'the pink hair puffs'],
  ['gavin', 'Gavin', 'the yellow cap'],
  ['yuki', 'Yuki', 'the purple bow on top'],
  ['yuki_brother', "Yuki's brother", 'the green shirt and brown hair'],
  ['angus', 'Angus', 'the big blue shirt'],
  ['stella', 'Stella', 'the pink pigtails and bow'],
  ['alice', 'Alice', 'the long brown hair'],
  ['aly', 'Aly', 'the little ponytail'],
  ['abigail', 'Abigail', 'the face mask'],
].map(([id, name, hint], i) => ({ id, name, hint, i }));
const IMG = {};
function loadImages() {
  const ids = FRIENDS.map(f => f.id).concat(['joshin']);
  return Promise.all(ids.map(id => new Promise(res => {
    const im = new Image(); im.onload = () => { IMG[id] = im; res(); }; im.onerror = () => res(); im.src = 'img/' + id + '.png';
  })));
}
// draw sprite with bottom-center anchor
// Oliver's picture is mostly hat: scale him so his head and body match everyone else
const SCALE_FIX = { oliver: 2.4 };
function spr(id, x, y, h, o = {}) {
  const im = IMG[id]; if (!im) return;
  h *= SCALE_FIX[id] || 1;
  const w = im.width * h / im.height;
  ctx.save(); ctx.translate(x, y);
  if (o.rot) ctx.rotate(o.rot);
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  const sx = (o.flip ? -1 : 1) * (o.sx || 1), sy = o.sy || 1;
  ctx.scale(sx, sy);
  ctx.drawImage(im, -w / 2, -h, w, h);
  ctx.restore();
  return w;
}
function sprW(id, h) { h *= SCALE_FIX[id] || 1; const im = IMG[id]; return im ? im.width * h / im.height : h * .7; }

// ================= audio =================
let AC = null, muted = store.get('muted', false);
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', vol = .07, slide = 0, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
const SFX = {
  jump: () => tone(420, .14, 'square', .05, 320),
  flap: () => tone(620, .14, 'triangle', .08, 500),
  coin: () => { tone(988, .07, 'square', .045); tone(1319, .14, 'square', .045, 0, .06); },
  rescue: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'triangle', .09, 0, i * .08)),
  hurt: () => tone(320, .32, 'sawtooth', .07, -220),
  stomp: () => { tone(220, .12, 'square', .08, -120); tone(660, .1, 'triangle', .06, 200, .05); },
  click: () => tone(700, .06, 'triangle', .07),
  power: () => [440, 554, 659, 880, 1109].forEach((f, i) => tone(f, .12, 'square', .045, 0, i * .055)),
  bomb: () => { tone(110, .45, 'sawtooth', .1, -60); tone(80, .5, 'square', .06, -30, .05); },
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .09, 0, i * .12)),
  wrong: () => tone(200, .25, 'square', .06, -60),
  boss: () => { tone(150, .5, 'sawtooth', .08, 100); },
};
function playBirthday() {
  const N = { G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, F5: 698, G5: 784 };
  const song = [['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
    ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
    ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 2.5]];
  let t = 0; const beat = .36;
  for (const [n, d] of song) { tone(N[n], d * beat * .95, 'triangle', .09, 0, t); tone(N[n] / 2, d * beat * .9, 'sine', .05, 0, t); t += d * beat; }
}

// ================= drawing helpers =================
function rr(x, y, w, h, r) {
  ctx.beginPath(); r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fillStroke(fill, stroke = INK, lw = 3) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function text(s, x, y, size, color = INK, o = {}) {
  ctx.save();
  ctx.font = `${o.font === 'b' ? '' : '800 '}${size}px ${o.font === 'b' ? FB : FT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.maxW) { const m = ctx.measureText(s).width; if (m > o.maxW) { const ns = size * o.maxW / m; ctx.font = `${o.font === 'b' ? '' : '800 '}${ns}px ${o.font === 'b' ? FB : FT}`; } }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.lw || Math.max(3, size / 6); ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function cloud(x, y, s, fill = '#fff', stroke = '#b9dbef') {
  const c = [[0, 0, 26], [28, -12, 30], [58, 0, 24], [30, 8, 24]];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (stroke) { ctx.fillStyle = stroke; for (const [a, b, r] of c) { ctx.beginPath(); ctx.arc(a, b, r + 3, 0, 7); ctx.fill(); } }
  ctx.fillStyle = fill; for (const [a, b, r] of c) { ctx.beginPath(); ctx.arc(a, b, r, 0, 7); ctx.fill(); }
  ctx.restore();
}
function bunting(x1, y1, x2, sag, n, t = 0) {
  const cols = ['#f0605d', '#ffd23f', '#5fc3e4', '#7ed957', '#c58cf0', '#ff8ac6'];
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo((x1 + x2) / 2, y1 + sag * 2, x2, y1); ctx.stroke();
  for (let i = 0; i < n; i++) {
    const u = (i + .5) / n, x = x1 + (x2 - x1) * u, y = y1 + sag * 4 * u * (1 - u) * 1 + 2;
    const sw = Math.sin(t * 2 + i) * 2;
    ctx.beginPath(); ctx.moveTo(x - 13, y); ctx.lineTo(x + 13, y); ctx.lineTo(x + sw, y + 30); ctx.closePath();
    fillStroke(cols[i % cols.length], INK, 2);
  }
}
function star(x, y, r, fill = '#ffd23f', rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr2 = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.closePath(); fillStroke(fill, INK, 2.5);
}
function heart(x, y, s, fill = '#ff4d6d') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath();
  ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8); ctx.bezierCurveTo(8, -16, 14, -4, 0, 6); ctx.closePath();
  ctx.restore(); fillStroke(fill, INK, 2.5);
}
function candle(x, y, s = 1, t = 0, lit = true) { // x,y = bottom center
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rr(-5, -26, 10, 26, 3); fillStroke('#fff', INK, 2);
  ctx.fillStyle = '#ff7eb3'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-5, -6 - i * 8); ctx.lineTo(5, -11 - i * 8); ctx.lineTo(5, -8 - i * 8); ctx.lineTo(-5, -3 - i * 8); ctx.fill(); }
  rr(-5, -26, 10, 26, 3); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(0, -31); ctx.stroke();
  if (lit) {
    const f = 1 + Math.sin(t * 18 + x) * .12;
    ctx.beginPath(); ctx.ellipse(0, -38, 5 * f, 9 * f, 0, 0, 7); ctx.fillStyle = '#ffb02e'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -36, 2.5, 5, 0, 0, 7); ctx.fillStyle = '#fff3a0'; ctx.fill();
  }
  ctx.restore();
}
function gift(x, y, w, h, col = '#c58cf0', rib = '#ffd23f') { // bottom-left
  rr(x, y - h, w, h, 4); fillStroke(col, INK, 3);
  ctx.fillStyle = rib; ctx.fillRect(x + w / 2 - 5, y - h + 2, 10, h - 4); ctx.fillRect(x + 2, y - h * .62 - 4, w - 4, 8);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(x + w / 2 - 5, y - h + 1, 10, h - 2);
  ctx.beginPath(); ctx.ellipse(x + w / 2 - 9, y - h - 6, 9, 6, -.5, 0, 7); fillStroke(rib, INK, 2);
  ctx.beginPath(); ctx.ellipse(x + w / 2 + 9, y - h - 6, 9, 6, .5, 0, 7); fillStroke(rib, INK, 2);
}
function bubble(x, y, r, t = 0) {
  const wob = Math.sin(t * 3) * 1.5;
  ctx.beginPath(); ctx.ellipse(x, y, r + wob, r - wob, 0, 0, 7);
  ctx.fillStyle = 'rgba(170,225,255,.35)'; ctx.fill(); ctx.strokeStyle = '#3d8fd1'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(x - r * .35, y - r * .4, r * .22, Math.PI, Math.PI * 1.7); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
}
function grumble(x, y, s = 1, t = 0, o = {}) { // center
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.flash) ctx.globalAlpha = .5;
  const c = [[-24, 4, 18], [-6, -10, 22], [16, -6, 20], [26, 8, 16], [0, 10, 20]];
  ctx.fillStyle = INK; for (const [a, b, r] of c) { ctx.beginPath(); ctx.arc(a, b, r + 3, 0, 7); ctx.fill(); }
  ctx.fillStyle = o.color || '#8f9ab3'; for (const [a, b, r] of c) { ctx.beginPath(); ctx.arc(a, b, r, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-9, 2, 6, 0, 7); ctx.arc(11, 2, 6, 0, 7); ctx.fill();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-8 + Math.sin(t * 2), 3, 3, 0, 7); ctx.arc(12 + Math.sin(t * 2), 3, 3, 0, 7); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-3, -3); ctx.moveTo(18, -8); ctx.lineTo(5, -3); ctx.stroke();
  ctx.beginPath(); ctx.arc(1, 17, 7, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.restore();
}
function bomb(x, y, s = 1, t = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); fillStroke('#7a5ca8', INK, 3);
  ctx.beginPath(); ctx.arc(-5, -5, 4, 0, 7); ctx.fillStyle = '#b39ddb'; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -14); ctx.quadraticCurveTo(6, -22, 10, -20); ctx.stroke();
  ctx.fillStyle = Math.sin(t * 30) > 0 ? '#ffd23f' : '#ff7a2e'; ctx.beginPath(); ctx.arc(11, -21, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#9bd36b'; ctx.globalAlpha = .7; ctx.beginPath(); ctx.arc(-14, 10, 5, 0, 7); ctx.arc(13, 11, 4, 0, 7); ctx.fill();
  ctx.restore();
}
function strawberry(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 16); ctx.bezierCurveTo(-18, 2, -16, -12, 0, -10); ctx.bezierCurveTo(16, -12, 18, 2, 0, 16); fillStroke('#ef3f4f', INK, 2.5);
  ctx.fillStyle = '#ffe08a'; for (const [a, b] of [[-6, -2], [5, -3], [0, 5], [-3, 10], [6, 6]]) { ctx.beginPath(); ctx.arc(a, b, 1.6, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(-9, -11); ctx.lineTo(0, -6); ctx.lineTo(9, -11); ctx.lineTo(0, -15); ctx.closePath(); fillStroke('#5cbf4a', INK, 2);
  ctx.restore();
}
function cupcake(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-13, 0); ctx.lineTo(13, 0); ctx.lineTo(9, 18); ctx.lineTo(-9, 18); ctx.closePath(); fillStroke('#5fc3e4', INK, 2.5);
  ctx.beginPath(); ctx.arc(-7, -1, 9, Math.PI, 0); ctx.arc(7, -1, 9, Math.PI, 0); ctx.arc(0, -9, 9, Math.PI, 0); ctx.closePath(); fillStroke('#ffb3d1', INK, 2.5);
  ctx.beginPath(); ctx.arc(0, -19, 4, 0, 7); fillStroke('#ef3f4f', INK, 2);
  ctx.restore();
}
function cake(x, y, w, h, nCandles, t, lit = nCandles) { // bottom center
  ctx.beginPath(); ctx.ellipse(x, y + 4, w * .62, 10, 0, 0, 7); fillStroke('#fff', INK, 2.5);
  rr(x - w / 2, y - h, w, h, 8); fillStroke('#ffc3d8', INK, 3);
  ctx.beginPath(); ctx.moveTo(x - w / 2, y - h + 14);
  for (let i = 0; i <= 8; i++) ctx.quadraticCurveTo(x - w / 2 + w * (i + .5) / 8, y - h + 26, x - w / 2 + w * (i + 1) / 8, y - h + 14);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
  for (let i = 0; i < nCandles; i++) candle(x - w / 2 + 14 + i * (w - 28) / Math.max(1, nCandles - 1), y - h + 2, .75, t, i < lit);
}
function speaker(x, y, on) {
  ctx.beginPath(); ctx.moveTo(x - 10, y - 6); ctx.lineTo(x - 4, y - 6); ctx.lineTo(x + 4, y - 13); ctx.lineTo(x + 4, y + 13); ctx.lineTo(x - 4, y + 6); ctx.lineTo(x - 10, y + 6); ctx.closePath();
  fillStroke(INK, INK, 2);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  if (on) { ctx.beginPath(); ctx.arc(x + 6, y, 7, -.8, .8); ctx.stroke(); ctx.beginPath(); ctx.arc(x + 6, y, 13, -.8, .8); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(x + 9, y - 6); ctx.lineTo(x + 19, y + 6); ctx.moveTo(x + 19, y - 6); ctx.lineTo(x + 9, y + 6); ctx.stroke(); }
}
function house(x, y) {
  ctx.beginPath(); ctx.moveTo(x - 13, y); ctx.lineTo(x, y - 12); ctx.lineTo(x + 13, y); ctx.lineTo(x + 9, y); ctx.lineTo(x + 9, y + 12); ctx.lineTo(x - 9, y + 12); ctx.lineTo(x - 9, y); ctx.closePath();
  fillStroke(INK, INK, 2.5); ctx.fillStyle = '#fff'; ctx.fillRect(x - 3, y + 4, 6, 8);
}
function skyBg(top, bot) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function hills(off, col, y, amp, per, edge = INK, wd = W) {
  const bot = y + 1500;
  ctx.beginPath(); ctx.moveTo(0, bot);
  for (let x = 0; x <= wd + 10; x += 10) ctx.lineTo(x, y - Math.sin((x + off) / per) * amp - Math.sin((x + off) / (per * .43)) * amp * .3);
  ctx.lineTo(wd + 10, bot); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = edge; ctx.globalAlpha = .25; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
}
function paperPanel(x, y, w, h, fill = PAPER) {
  ctx.save(); ctx.shadowColor = 'rgba(29,43,92,.25)'; ctx.shadowOffsetY = 5; ctx.shadowBlur = 0;

const keys = {};

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.focus(); ac();
  if (e.pointerType === 'touch') touchMode = true;
  const raw = toLogical(e);
  for (const b of globalButtons()) if (hit(b, raw)) { SFX.click(); b.fn(); return; }
  updXf(); refreshButtons();
  const p = toScene(raw);
  for (const b of (scene.buttons || [])) if (!b.hidden && hit(b, p)) { SFX.click(); b.fn(); return; }
  pointers.set(e.pointerId, p);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  scene.down && scene.down(p, e.pointerId);
});
cv.addEventListener('pointermove', e => { if (pointers.has(e.pointerId)) { const p = toScene(toLogical(e)); pointers.set(e.pointerId, p); scene.move && scene.move(p, e.pointerId); } });

cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
addEventListener('keydown', e => {

  ac();

const CharSelect = {
  open(next) { this.next = next; go(CharSelect); },
  fit() { return PORT ? [540, 960] : [960, 540]; },
  enter() { this.sel = Math.max(0, ALL.findIndex(c => c.id === pid())); this.mk(); },
  mk() {
    this.port = PORT; const dw = PORT ? 540 : 960;
    this.buttons = [{ x: dw / 2 - 170, y: PORT ? 852 : 468, w: 340, h: PORT ? 76 : 60, col: '#36b37e', label: '', fn: () => this.start() }];
  },
  cols() { return PORT ? 5 : 9; },
  cells() {
    const dw = PORT ? 540 : 960, cols = this.cols(), x0 = PORT ? 18 : 28, y0 = PORT ? 158 : 104, cw = (dw - 2 * x0) / cols, ch = PORT ? 136 : 120;
    return ALL.map((c, i) => ({ c, i, x: x0 + (i % cols) * cw, y: y0 + Math.floor(i / cols) * ch, w: cw, h: ch }));
  },
  start() { store.set('player', ALL[this.sel].id); SFX.rescue(); go(this.next); },
  key(c) {
    const n = ALL.length, cols = this.cols();
    if (c === 'ArrowLeft') this.sel = (this.sel + n - 1) % n;
    else if (c === 'ArrowRight') this.sel = (this.sel + 1) % n;
    else if (c === 'ArrowUp') this.sel = Math.max(0, this.sel - cols);
    else if (c === 'ArrowDown') this.sel = Math.min(n - 1, this.sel + cols);
    else if (c === 'Enter' || c === 'Space') return this.start();
    else return;
    SFX.click();
  },
  down(p) {
    const cell = this.cells().find(k => hit(k, p)); if (!cell) return;
    if (cell.i === this.sel) this.start(); else { this.sel = cell.i; SFX.click(); }
  },
  update() { if (this.port !== PORT) this.mk(); this.buttons[0].label = `Play as ${ALL[this.sel].name}!`; },
  bg() { partyBg(); },
  draw() {
    const dw = PORT ? 540 : 960, game = GAMES.find(g => g.scene() === this.next);

      const parts = two ? [k.c.name.split(' ').slice(0, -1).join(' '), k.c.name.split(' ').pop()] : [k.c.name];
      parts.forEach((l, j) => text(l, cx, k.y + k.h - 19 + j * 13 - (parts.length - 1) * 6, two ? 14 : 16, INK, { font: 'b', maxW: k.w - 12 }));

  grid() {

  },
  layout() {

      const isT = this.hl === m && (this.state === 'got' || this.state === 'miss');
      const dim = (this.state === 'got' || this.state === 'miss') && !isT;
      const jx = m.shake > 0 ? Math.sin(T * 60) * 5 : 0;
      const jy = isT ? -Math.abs(Math.sin(T * 9)) * 26 : 0;
      if (isT) { ctx.beginPath(); ctx.ellipse(m.x, m.y - m.h / 2, m.h * .5, m.h * .62, 0, 0, 7); ctx.fillStyle = 'rgba(255,210,63,.6)'; ctx.fill(); }
      spr(m.f.id, m.x + jx, m.y + jy, m.h, { alpha: dim ? .3 : 1, flip: m.flip });
    }
    // prompt banner (between the home and sound buttons)
    const bx = 70, bw = W - 140;
    bannerSign(bx, 10, bw, PORT ? 104 : 92);
    if (this.state === 'play' || this.state === 'got') {
      text(`Find ${this.target.name}!`, W / 2, 44, PORT ? 34 : 40, INK, { maxW: bw - 30 });
      if (this.time < 8 || this.state === 'got') text(`Hint: look for ${this.target.hint}`, W / 2, PORT ? 84 : 82, PORT ? 18 : 21, PINK, { font: 'b', maxW: bw - 24 });
      else text(`Round ${this.round + 1} of ${this.total}`, W / 2, PORT ? 84 : 82, 21, INK, { font: 'b' });
    } else if (this.state === 'miss') text(`Here's ${this.target.name}!`, W / 2, 56, 36, PINK, { maxW: bw - 30 });
    const ty = PORT ? 124 : 108;
    rr(bx + 30, ty, bw - 120, 18, 9); fillStroke('#fff', INK, 2.5);
    if (this.state !== 'over') { rr(bx + 32, ty + 2, (bw - 124) * clamp(this.time / 12, 0, 1), 14, 7); fillStroke(this.time < 4 ? '#ff4d6d' : '#7ed957', null); }
    text(`${this.score}`, bx + bw - 40, ty + 10, 22, INK, { stroke: '#fff', lw: 5 });
    drawParts(this.parts);
    if (this.state === 'over') {
      const stars = this.found >= 9 ? 3 : this.found >= 6 ? 2 : this.found >= 3 ? 1 : 0, cg = cardGeom();
      resultCard(this.newBest ? 'New best!' : 'Well done!', [`Score: ${this.score}`, `You found ${this.found} of ${this.total} friends.`, `Best: ${store.get('best_find', 0)}`], []);
      for (let q = 0; q < 3; q++) star(W / 2 - 60 + q * 60, cg.cy + 270, 24, q < stars ? '#ffd23f' : '#e6e6e6', Math.sin(T * 2 + q) * .2);
    }
  }
};

// ================= GAME 4: CAKE CATCH =================
const Catch = {
  enter() { this.reset(); },
  reset() {
    this.pid = pid();
    this.state = 'ready'; this.t = 60; this.score = 0; this.lives = 3; this.x = W / 2; this.vx = 0; this.items = []; this.parts = [];
    this.spawnT = 0; this.cloud = { x: 200, dir: 1, dropT: 2 }; this.lit = 0; this.helpT = 4; this.bag = shuffle(others()); this.runner = null; this.helped = [];
    this.pow = { double: 0, slow: 0, big: 0, magnet: 0, shield: 0 }; this.targetX = null; this.buttons = []; this.elapsed = 0; this.hurtT = 0;
  },
  geo() { return { table: H - 70, plate: H - 122, foot: H - 28, cloudY: PORT ? 168 : 92, fall: H / 540 }; },
  key(c) { if (this.state === 'ready' && ['Space', 'Enter', 'ArrowLeft', 'ArrowRight'].includes(c)) this.state = 'play'; },
  pads() { return { L: ['left'], R: ['right'] }; },
  down(p) { if (this.state === 'ready') { this.state = 'play'; return; } this.targetX = p.x; },
  move(p) { this.targetX = p.x; },
  up() { if (!pointers.size) this.targetX = null; },
  finish() {
    this.state = 'over'; SFX.win();
    const best = store.get('best_catch', 0); this.newBest = this.score > best; if (this.newBest) store.set('best_catch', this.score);
    this.buttons = cardButtons([['Play again', () => this.reset(), '#36b37e'], ['Menu', () => go(Menu), '#4c8de8']]);
  },
  update(dt) {
    updParts(this.parts, dt);
    if (this.state !== 'play') return;
    const G4 = this.geo();
    this.t -= dt; this.elapsed += dt; this.hurtT = Math.max(0, this.hurtT - dt);
    if (this.t <= 0) { this.t = 0; return this.finish(); }
    for (const k in this.pow) if (k !== 'shield') this.pow[k] = Math.max(0, this.pow[k] - dt);
    const slow = this.pow.slow > 0 ? .5 : 1;
    const kd = (K.right() ? 1 : 0) - (K.left() ? 1 : 0);
    if (kd) { this.vx += kd * 3200 * dt; this.vx = clamp(this.vx, -620, 620); this.targetX = null; }
    else if (this.targetX != null) { this.vx = clamp((this.targetX - this.x) * 12, -900, 900); }
    else this.vx *= Math.pow(.0005, dt);
    this.x = clamp(this.x + this.vx * dt, 50, W - 50);
    const plateW = this.pow.big > 0 ? 150 : 92, plateY = G4.plate;
    const diff = Math.min(1, this.elapsed / 55);
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      this.spawnT = (.75 - diff * .4) * (PORT ? 1.25 : 1);
      const r = Math.random();
      const type = r < .38 ? 'candle' : r < .64 ? 'berry' : r < .9 ? 'cupcake' : 'star';
      this.items.push({ type, x: rnd(40, W - 40), y: -30, vy: (rnd(150, 200) + diff * 150) * G4.fall, r: rnd(-.3, .3) });
    }
    const c = this.cloud; c.x += c.dir * (90 + diff * 120) * dt; if (c.x < 80) c.dir = 1; if (c.x > W - 80) c.dir = -1;
    c.dropT -= dt;
    if (c.dropT <= 0) { c.dropT = rnd(1.4, 2.2) - diff * .7; this.items.push({ type: 'bomb', x: c.x, y: G4.cloudY + 28, vy: (140 + diff * 140) * G4.fall, r: 0 }); }
    this.helpT -= dt;
    if (this.helpT <= 0 && !this.runner) {
      if (!this.bag.length) this.bag = shuffle(others());
      const power = pick(['double', 'slow', 'big', 'magnet', 'shield']), f = this.bag.pop(), dir = Math.random() < .5 ? 1 : -1;
      this.runner = { f, power, x: dir > 0 ? -60 : W + 60, dir };
      this.pow[power] = power === 'shield' ? 1 : power === 'slow' ? 6 : 8;
      if (!this.helped.includes(f.id)) this.helped.push(f.id);
      SFX.power();
      this.banner = { s: `${f.name}: ${{ double: 'Double points!', slow: 'Slow-mo!', big: 'Big plate!', magnet: 'Treat magnet!', shield: 'Stink shield!' }[power]}`, t: 2.2 };
      this.helpT = rnd(7, 9);
    }
    if (this.runner) { this.runner.x += this.runner.dir * 380 * dt; if (this.runner.x < -100 || this.runner.x > W + 100) this.runner = null; }
    if (this.banner) this.banner.t -= dt;
    for (const it of this.items) {
      if (this.pow.magnet > 0 && it.type !== 'bomb' && it.y > G4.cloudY + 60) it.x += clamp(this.x - it.x, -1, 1) * Math.min(Math.abs(this.x - it.x), 260 * dt);
      it.y += it.vy * slow * dt; it.r += dt;
      if (!it.done && it.y > plateY - 22 && it.y < plateY + 12 && Math.abs(it.x - this.x) < plateW / 2 + 8) {
        it.done = true;
        if (it.type === 'bomb') {
          if (this.pow.shield > 0) { this.pow.shield = 0; burst(this.parts, it.x, it.y, 18, ['#5fc3e4', '#fff']); popText(this.parts, it.x, it.y - 40, 'Blocked!', '#4c8de8'); SFX.stomp(); }
          else { this.lives--; this.hurtT = .8; SFX.bomb(); burst(this.parts, it.x, it.y, 22, ['#9bd36b', '#7a5ca8', '#c9e7a8']); popText(this.parts, it.x, it.y - 40, 'Pee-yew!', '#6a4c98', 28); if (this.lives <= 0) return this.finish(); }
        } else {
          const base = { candle: 10, berry: 15, cupcake: 20, star: 50 }[it.type], pts = base * (this.pow.double > 0 ? 2 : 1);
          this.score += pts; SFX.coin(); popText(this.parts, it.x, it.y - 30, `+${pts}`, it.type === 'star' ? '#ff7a2e' : PINK, 24);
          if (it.type === 'candle') { this.lit++; if (this.lit >= 9) { this.lit = 0; this.score += 200; SFX.win(); burst(this.parts, 90, G4.table - 150, 40); popText(this.parts, W / 2, G4.table - 220, 'All 9 candles lit! +200', PINK, 30); } }
        }
      }
    }
    this.items = this.items.filter(it => !it.done && it.y < H + 40);
  },
  draw() {
    const G4 = this.geo();
    skyBg('#ffcf8f', '#fff2db');
    cloud(W * .12, G4.cloudY + 70, .9, '#fff', '#ffe0b8'); cloud(W * .72, G4.cloudY + 100, 1.1, '#fff', '#ffe0b8');
    bunting(-10, 0, W / 2, 16, PORT ? 5 : 8, T); bunting(W / 2, 0, W + 10, 16, PORT ? 5 : 8, T);
    ctx.fillStyle = '#ff9ec4'; ctx.fillRect(0, G4.table, W, H - G4.table); ctx.fillStyle = '#fff'; for (let x = 0; x < W; x += 40) ctx.fillRect(x, G4.table, 20, H - G4.table);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, G4.table); ctx.lineTo(W, G4.table); ctx.stroke();
    cake(80, G4.table, 120, 60, 9, T, this.lit);
    text('Light all 9!', 80, G4.table - 112, 20, INK, { font: 'b', stroke: '#fff', lw: 5 });
    grumble(this.cloud.x, G4.cloudY, 1.4, T);
    for (const it of this.items) {
      if (it.type === 'candle') { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(Math.sin(it.r * 3) * .3); candle(0, 18, 1, T); ctx.restore(); }
      if (it.type === 'berry') strawberry(it.x, it.y, 1.1);
      if (it.type === 'cupcake') cupcake(it.x, it.y, 1.1);
      if (it.type === 'star') star(it.x, it.y, 20, '#ffd23f', it.r * 2);
      if (it.type === 'bomb') bomb(it.x, it.y, 1.1, T);
    }
    if (this.runner) { const r = this.runner; spr(r.f.id, r.x, H - 2 - Math.abs(Math.sin(T * 14)) * 10, 62, { flip: r.dir < 0 }); }
    const plateW = this.pow.big > 0 ? 150 : 92;
    const flick = this.hurtT > 0 && Math.sin(T * 40) > 0;
    if (!flick) spr(this.pid, this.x, G4.foot, this.pid === 'joshin' ? 92 : 94, { flip: this.vx < -30 });
    ctx.beginPath(); ctx.ellipse(this.x, G4.plate + 2, plateW / 2, 9, 0, 0, 7); fillStroke(this.pow.big > 0 ? '#ffd23f' : '#fff', INK, 3);
    if (this.pow.shield > 0) { ctx.beginPath(); ctx.arc(this.x, G4.plate + 2, plateW / 2 + 16, Math.PI, 0); ctx.strokeStyle = '#4c8de8'; ctx.lineWidth = 4; ctx.stroke(); }
    drawParts(this.parts);
    for (let q = 0; q < 3; q++) heart(90 + q * 32, 34, 1.15, q < this.lives ? '#ff4d6d' : '#e6e6e6');
    rr(186, 12, 150, 46, 23); fillStroke('rgba(255,255,255,.88)', INK, 3); text(`${this.score}`, 261, 36, 28, INK);
    rr(346, 12, 110, 46, 23); fillStroke(this.t < 10 ? '#ffd0d8' : 'rgba(255,255,255,.88)', INK, 3); text(`${Math.ceil(this.t)}s`, 401, 36, 26, INK);
    chips([['double', 'x2', '#ff6b8b'], ['slow', 'Slow', '#c58cf0'], ['big', 'Big', '#ffd23f'], ['magnet', 'Magnet', '#36b37e'], ['shield', 'Shield', '#5fc3e4']].filter(c => this.pow[c[0]] > 0).map(c => [c[1], c[2]]), PORT ? 80 : 468, PORT ? 66 : 16);
    if (this.banner && this.banner.t > 0) { const bw = Math.min(420, W - 40), by = PORT ? G4.cloudY + 50 : 130; bannerSign(W / 2 - bw / 2, by, bw, 56); text(this.banner.s, W / 2, by + 28, 26, INK, { maxW: bw - 30 }); }
    if (this.state === 'ready') readyPanel('Cake Catch', [touchMode ? 'Use the arrow buttons to move.' : 'Arrow keys or the mouse to move.', 'Catch candles, berries, cupcakes and stars.', "Don't catch the stink bombs!", 'Friends run by with power-ups. 60 seconds!'], touchMode ? 'Press an arrow to start!' : 'Click or press Space to start!');
    if (this.state === 'over') resultCard(this.lives <= 0 ? 'Stinky!' : this.newBest ? 'New best!' : "Time's up!", [`Score: ${this.score}`, `Best: ${store.get('best_catch', 0)}`, `Friends who helped: ${this.helped.length}`], this.helped.slice(-8));
  }
};

// ================= PARTY (finale: Joshin is always the one celebrated) =================
const Party = {
  fit() { return PORT ? [540, 1000] : [960, 540]; },
  enter() { this.parts = []; this.t = 0; playBirthday(); this.mk(); },
  mk() {
    this.port = PORT;
    this.buttons = PORT ? [button(120, 928, 140, 56, 'Sing', () => playBirthday(), '#c58cf0'), button(280, 928, 140, 56, 'Games', () => go(Menu), '#4c8de8')]
      : [button(392, 470, 86, 46, 'Sing', () => playBirthday(), '#c58cf0'), button(482, 470, 86, 46, 'Games', () => go(Menu), '#4c8de8')];
  },
  update(dt) {
    if (this.port !== PORT) this.mk();
    this.t += dt; updParts(this.parts, dt);
    if (Math.random() < dt * 4) burst(this.parts, rnd(60, (PORT ? 540 : 960) - 60), rnd(-20, 40), 10);
  },
  bg() { partyBg(); },
  draw() {
    const resc = store.get('rescued', []), me = pid();
    const shown = f => resc.includes(f.id) || f.id === me ? 1 : .4;
    const thanks = me !== 'joshin' ? `Thanks for playing, ${pname()}!` : '';
    if (PORT) {
      bannerSign(15, 68, 510, 150);
      text('TQ for coming to my birthday party', 270, 106, 30, INK, { maxW: 480 });
      text('and celebrating my 9th birthday', 270, 148, 28, PINK, { maxW: 480 });
      text('with me!', 270, 186, 28, PINK);
      text('Happy birthday, Joshin!', 270, 248, 28, INK, { font: 'b', stroke: '#fff', lw: 6 });
      if (thanks) text(thanks, 270, 278, 20, '#36b37e', { font: 'b', stroke: '#fff', lw: 5 });
      const rowY = [372, 466, 805, 898];
      FRIENDS.forEach((f, i) => { const row = Math.floor(i / 6), j = i % 6; spr(f.id, 50 + j * 88, rowY[row] - Math.abs(Math.sin(T * 6 + i)) * 12, 82, { alpha: shown(f) }); });
      spr('joshin', 270 + Math.sin(T * 1.5) * 24, 630 + Math.sin(T * 3) * 8, 150);
      cake(270, 712, 190, 70, 9, T);
    } else {
      bannerSign(130, 24, 700, 100);
      text('TQ for coming to my birthday party', 480, 58, 34, INK, { maxW: 660 });
      text('and celebrating my 9th birthday with me!', 480, 98, 28, PINK, { maxW: 660 });
      const xs = j => j < 6 ? 52 + j * 64 : 588 + (j - 6) * 64;
      FRIENDS.forEach((f, i) => { const front = i >= 12, j = i % 12; spr(f.id, xs(j), (front ? 532 : 352) - Math.abs(Math.sin(T * 6 + i)) * 12, front ? 86 : 80, { alpha: shown(f) }); });
      cake(480, 420, 170, 70, 9, T);
      spr('joshin', 480 + Math.sin(T * 1.5) * 20, 300 + Math.sin(T * 3) * 8, 150);
      text('Happy birthday, Joshin!', 480, 145, 26, INK, { font: 'b', stroke: '#fff', lw: 6 });
      if (thanks) text(thanks, 480, 172, 18, '#36b37e', { font: 'b', stroke: '#fff', lw: 5 });
    }
    drawParts(this.parts);
  }
};

// ================= main loop =================
let last = 0;
function frame(ts) {
  const dt = Math.min(.033, (ts - last) / 1000 || 0); last = ts; T += dt;
  if (layoutPads()) resize();
  scene.update(dt);
  updXf(); refreshButtons();
  ctx.save();
  if (scene.xf) { scene.bg && scene.bg(); ctx.translate(scene.xf.ox, scene.xf.oy); ctx.scale(scene.xf.s, scene.xf.s); }
  scene.draw(); drawButtons();
  ctx.restore();
  drawGlobalButtons();
  requestAnimationFrame(frame);
}
(async function boot() {
  resize();
  const fontWait = document.fonts ? Promise.race([Promise.all([document.fonts.load('800 20px "Baloo 2"'), document.fonts.load('20px "Patrick Hand"')]), new Promise(r => setTimeout(r, 2000))]) : Promise.resolve();
  await Promise.all([loadImages(), fontWait.catch(() => {})]);
  document.getElementById('loading').hidden = true;
  go(Menu); resize(); requestAnimationFrame(frame);
})();
</script>
