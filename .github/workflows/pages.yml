name: Deploy Aquarium World to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['aquarium-world/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the release id into the offline cache
        run: sed -i "s/const VERSION = 'dev'/const VERSION = '${GITHUB_SHA::12}'/" aquarium-world/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: aquarium-world
      - id: deployment
        uses: actions/deploy-pages@v4
