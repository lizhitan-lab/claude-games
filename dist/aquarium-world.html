<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;box-shadow:0 0 0 2px #1a2340,0 0 40px #0a1a40}
  #touch{display:none;width:100%;max-width:520px;height:150px;position:relative;flex:none}
  body.touch #touch{display:block}
  .tb{position:absolute;background:#1c2850;border:2px solid #6a80c0;color:#dfe6ff;font:bold 16px monospace;
      display:flex;align-items:center;justify-content:center;border-radius:10px;opacity:.85}
  .tb.on{background:#3a5aa0}
  #dpad{position:absolute;left:8px;top:4px;width:150px;height:142px;touch-action:none}
  #dpad .tb{pointer-events:none}
  #nameInput{position:fixed;display:none;z-index:5;box-sizing:border-box;border:0;outline:none;padding:0;margin:0;
      background:transparent;color:transparent;caret-color:transparent;font-size:16px;-webkit-user-select:text;user-select:text}
  .overlay{position:fixed;display:none;z-index:5;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:16px}
  #help{color:#7f8fbf;font:12px monospace;margin-top:8px;text-align:center}
  body.touch #help{display:none}
</style>

// ---- js/engine.js ----
'use strict';
// ============ Core / utils ============
const W = 320, H = 240, TS = 16;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
let T = 0; // global frame counter

const rnd = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').imageSmoothingEnabled = false;
  return c;
}
function seeded(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) >>> 0;
  h = ((h ^ (h >>> 13)) * 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
function shade(hex, amt) { // amt -1..1
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}
function fmt(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

function rect(x, y, w, h, c, g = ctx) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function pline(x0, y0, x1, y1, c, g = ctx, th = 1) { // pixel line
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy; g.fillStyle = c;
  for (let i = 0; i < 2000; i++) {
    g.fillRect(x0, y0, th, th);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function pellipse(cx, cy, rx, ry, c, g = ctx) { // filled pixel ellipse
  g.fillStyle = c;
  for (let y = -ry; y <= ry; y++) {
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.0001))));
    g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
  }
}
function pring(cx, cy, rx, ry, c, g = ctx) {
  g.fillStyle = c;
  const n = Math.max(12, Math.round((rx + ry) * 3));
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    g.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1);
  }
}

const fishCache = {};
function genFish(sp, L, Ht, pal) {

      case 'spots': if (hv % 5 === 0 && ch === 'B') ch = 'D'; break;

      case 'rainbow': if (Math.abs(y + 0.5 - cy) < 1) ch = 'R'; else if (hv % 7 === 0 && ch === 'B') ch = 'D'; break;
      case 'koi': if (hash2(x >> 2, y >> 2) % 3 === 0) ch = 'W'; break;
      case 'koi2': if (hash2(x >> 2, (y >> 2) + 9) % 3 === 0) ch = 'D'; break;
      case 'shine': if (hv % 7 === 0) ch = 'W'; break;
      case 'plates': if (y === Math.round(cy - ry * 0.45) && x % 3 === 0) ch = 'W'; break;
      case 'blotch': if (hash2(x >> 1, (y >> 1) + 3) % 4 === 0 && ch === 'B') ch = 'D'; break;
      case 'stars': if (hv % 9 === 0) ch = 'Y'; break;
      case 'eyespot': if (Math.abs(x - (bodyL - 4)) <= 1 && Math.abs(y + 0.5 - cy) <= 1) ch = (x === bodyL - 4 && Math.round(cy - 0.5) === y) ? 'Y' : 'E'; break;

  }
  for (let x = Math.round(cx); x <= Math.round(cx) + 1; x++) if (botRow + 1 < rows) g[botRow + 1][x] = 'F';
  const ex = Math.max(1, Math.round(cx - rx * 0.62)), ey = Math.round(cy - ry * 0.3);

class QtyUI {
  constructor(name, price, max, cb) { Object.assign(this, { name, price, max, cb, q: 1 }); }
  update() {
    let d = 0;
    if (inp.rep('right')) d = 1; if (inp.rep('left')) d = -1; if (inp.rep('up')) d = 10; if (inp.rep('down')) d = -10;
    if (d) { this.q = clamp(this.q + d, 1, this.max); sfx('blip'); }
    if (inp.pressed.a) { popUI(this); this.cb(this.q); }
    if (inp.pressed.b || inp.pressed.menu) { sfx('cancel'); popUI(this); }
  }
  add(d) { this.q = clamp(this.q + d, 1, this.max); sfx('blip'); }

    btn(194, 86, 26, 18, '+1', () => this.add(1)); btn(222, 86, 34, 18, '+10', () => this.add(10));

    if (this.state === 'idle') {

        let r = Math.random() * tot, idx = 0;
        while (r >= WHEEL_SEGS[idx].w) { r -= WHEEL_SEGS[idx].w; idx++; }
        const n = WHEEL_SEGS.length, seg = Math.PI * 2 / n;

      }

    WHEEL_SEGS.forEach((s, i) => {
      const a = this.a + (i + 0.5) / WHEEL_SEGS.length * Math.PI * 2;
      textC(s.label, cx + Math.cos(a) * 40, cy + Math.sin(a) * 40 - 3, '#fff', '#101028');
    });
    // pointer
    for (let i = 0; i < 7; i++) rect(cx - 6 + i, cy - 72 + i, 13 - i * 2, 1, i === 0 ? '#101028' : '#ff4040');

    WHEEL_SEGS.forEach((s, i) => {

      text(s.desc, 224, 29 + i * 14, this.win === i && (T >> 3) % 2 ? '#ffe890' : '#fff');

    btn(262, 160, 46, 20, 'Leave', () => { inp.pressed.b = true; });

  }

<script>
// ---- js/field.js ----
'use strict';
// ============ Overhead field (city / home) ============
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function makeEntity(tx, ty, dir, sprites) {
  return { tx, ty, ox: tx, oy: ty, x: tx * TS, y: ty * TS, dir, moving: false, walkT: 0, sprites };
}
function stepEntity(e, speed) {
  if (!e.moving) return false;
  const gx = e.tx * TS, gy = e.ty * TS;
  e.x += clamp(gx - e.x, -speed, speed); e.y += clamp(gy - e.y, -speed, speed);
  e.walkT += speed / 2;
  if (e.x === gx && e.y === gy) { e.moving = false; e.ox = e.tx; e.oy = e.ty; return true; }
  return false;
}
function entSprite(e) {
  const f = e.moving || e.walkHold > 0 ? WALKSEQ[Math.floor(e.walkT / 4) % 4] : 0;
  return e.sprites[e.dir][f];
}

class Field {
  constructor(id, w, h, theme) {

  }
  tile(x, y) { return x < 0 || y < 0 || x >= this.w || y >= this.h ? TL.TREE : this.tiles[y * this.w + x]; }
  set(x, y, t) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.tiles[y * this.w + x] = t; }

  solidAt(x, y, self) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return true;
    if (SOLID_TILES.has(this.tile(x, y))) return true;
    for (const o of this.objs) if (o.solid && x >= o.x && x < o.x + o.w && y >= o.y && y < o.y + o.h && !(o.door && o.door[0] === x && o.door[1] === y)) return true;
    const ents = this.npcs.concat(this.player ? [this.player] : []);

    return false;
  }

  update() {

  }

// ---------------- Home world ----------------
const TANK_PLOTS = [[2, 5], [5, 5], [13, 5], [16, 5], [2, 9], [5, 9], [13, 9], [16, 9]];
const DECOR_SPOTS = [[1, 1], [4, 1], [14, 1], [17, 1], [2, 12], [16, 12]];
function buildHome() {
  const w = G.world, th = THEMES[w.theme];
  const f = new Field('home', 20, 15, th);
  f.label = w.name; f.song = 'home';
  for (let x = 0; x < f.w; x++) { f.set(x, 0, TL.TREE); f.set(x, f.h - 1, TL.TREE); }
  for (let y = 0; y < f.h; y++) { f.set(0, y, TL.TREE); f.set(f.w - 1, y, TL.TREE); }
  f.fill(10, 5, 10, 13, TL.PATH); f.fill(2, 8, 17, 8, TL.PATH);
  const r = seeded(7 + w.theme);
  for (let y = 1; y < f.h - 1; y++) for (let x = 1; x < f.w - 1; x++) if (f.tile(x, y) === TL.GRASS && r() < 0.12) f.set(x, y, TL.FLOWER);
  // house
  const himg = makeHouse(w.house, w.theme);

  // flag & sign
  const flagCol = FLAG_COLORS[w.flag][1];

  // tank plots
  TANK_PLOTS.forEach(([x, y], i) => {
    const t = w.tanks[i];
    f.objs.push({
      x, y, w: 2, h: 2, solid: true, shadow: !!t,
      draw: (sx, sy) => t ? drawTank(t.type, sx, sy, t.fish, i) : drawPlot(sx, sy),
      interact: () => t ? pushUI(new TankUI(i)) : say('An empty plot. Buy aquariums at the Tank Emporium in the city and they will appear here!'),
    });
  });
  // decor
  for (const id of w.decor) {
    const [x, y] = DECOR_SPOTS[DECOR[id].spot];
    f.objs.push({ x, y, w: 2, h: 2, solid: true, shadow: true, draw: (sx, sy) => drawDecor(id, sx, sy), interact: () => say('Your ' + DECOR[id].name + '. Visitors love it!') });
  }
  // visitors

  const nVis = Math.min(6, Math.floor(inc / 20));
  const spots = [[4, 7], [15, 7], [8, 10], [12, 11], [3, 11], [17, 11]];
  const vlines = () => {
    const fish = w.tanks.flatMap(t => t.fish);
    const best = fish.sort((a, b) => b.value - a.value)[0];
    return [
      best ? 'Wow, look at that ' + FISH[best.id].name + '! Worth the ticket!' : 'Nice place you have here!',
      'What a lovely world. I will tell my friends about ' + w.name + '!',
      w.tanks.length ? 'I could watch these aquariums all day.' : 'Where are the aquariums?',
      'Ticket price is fair, I say!'];
  };
  for (let i = 0; i < nVis; i++) {
    const [x, y] = spots[i];
    const girl = i % 2 === 1;
    f.addNPC('Visitor', x, y, girl ? 'girl' : 'boy', { hair: pick(['#2a1a10', '#e0b040', '#b04030', '#4a4a4a', '#f0f0f0']), shirt: pick(['#e04848', '#40a0e0', '#60c060', '#e0a020', '#a060d0']), dress: pick(['#3070c0', '#c04070', '#40a060']) }, vlines, 2);
  }

}
function houseMenu() {

function rebuildHome() {

function themePicker(done, preview) {

function flagPicker(done, preview) {

function worldInfo() {

class TankUI {
  constructor(i) { this.i = i; this.build(0); }
  get tank() { return G.world.tanks[this.i]; }
  build(sel) {
    const t = this.tank, def = TANKS[t.type];

      label: (f.rare ? '*' : '') + FISH[f.id].name, right: f.size + 'cm', color: f.rare ? '#ffe890' : '#fff',

        t.fish.splice(k, 1); G.cooler.push(f); sfx('splash'); this.build(this.menu.sel);
      }),
    }));
    if (t.fish.length < def.cap) items.push({ label: '+ Add a fish', color: '#a8ffa8', action: () => this.add() });
    items.push({ label: 'Done', action: () => popUI(this) });
    this.menu = new Menu({ x: 8, y: 112, w: 180, rows: 9, items, sel: Math.min(sel, items.length - 1), title: def.name + ' ' + t.fish.length + '/' + def.cap, onCancel: () => popUI(this) });
  }
  add() {
    if (!G.cooler.length) { say('Your cooler is empty. Go catch some fish first!'); return; }
    const t = this.tank;
    const list = G.cooler.slice().sort((a, b) => b.value - a.value);

      x: 120, y: 30, w: 190, rows: 12, title: 'Pick a fish',

      })),
      onCancel: () => popUI(m),
    }));
  }
  update() { this.menu.update(); }
  draw() {
    drawWin(8, 8, 180, 100, 'dark');
    ctx.save(); ctx.translate(50, 10); ctx.scale(3, 3); drawTank(this.tank.type, 0, 0, this.tank.fish, this.i); ctx.restore();
    this.menu.draw(ui[ui.length - 1] === this);
    drawWin(192, 8, 122, 100);
    text('Daily visitors', 200, 16, '#a8b8f0'); text('$' + Math.round(tankIncome(this.tank)) + ' AC/day', 200, 28, '#ffe890');
    text('Bonus x' + TANKS[this.tank.type].mult, 200, 44);
    wrap('Fish on display earn ticket money every day but cannot be sold.', 19).forEach((l, i) => text(l, 200, 60 + i * 10, '#c8d0f0'));
  }
}

  rect(0, 118, 78, 10, a.dock, fgc);

// ============ Fishing ============
function pickFish(L, bait, dist) {
  const st = stats(), p = G.player;
  let rc = 0.02 + st.luck * 0.006 + bait.rare + dist * 0.02 + p.level * 0.001;
  if (bait.tier < 0) rc *= 0.3;
  if (Math.random() < rc) return L.rare;
  const opts = L.fish.map(id => {
    const sp = FISH[id];
    let w = sp.w * Math.pow(1 + 0.22 * Math.max(0, bait.tier), sp.d / 3) * (1 + dist * (sp.d / 10));
    if (bait.tier < 0 && sp.d > 2) w *= 0.4;
    return [id, w];
  });
  opts.push(['boot', bait.tier < 0 ? 12 : 6 / (1 + bait.tier)]);
  let tot = opts.reduce((a, o) => a + o[1], 0), r = Math.random() * tot;
  for (const [id, w] of opts) { if ((r -= w) < 0) return id; }
  return opts[0][0];
}

  const size = Math.round((sp.min + (sp.max - sp.min) * t) * 10) / 10;

        if (k >= 1) {

    if (T % 10 === 0) this.ripple(this.bob.x + rnd(-4, 4), this.bob.y, 1);
    if (r.prog >= 100) this.caught();
    else if (r.prog <= 0) { sfx('fail'); this.say('The line went slack... it got away!'); }
  },
  caught() {
    const id = this.fishId, sp = FISH[id], f = makeFish(id, this.dist);
    const xp = sp.junk ? 1 : Math.round((4 + sp.d * 5) * (sp.rare ? 3 : 1) * (0.85 + 0.3 * f.t));
    delete f.t;
    const isNew = !G.log[id];
    const e = G.log[id] || (G.log[id] = { n: 0, best: 0 });
    e.n++; e.best = Math.max(e.best, f.size);
    G.stats.caught++; this.trip++;
    let kept = true;
    if (G.cooler.length >= MAX_COOLER) kept = false; else G.cooler.push(f);
    const ups = addXP(xp);
    sfx(sp.rare ? 'rare' : sp.junk ? 'cancel' : 'catch');
    if (ups) setTimeout(() => sfx('level'), 700);
    this.state = 'card'; this.bob = null;
    pushUI(new CatchCard(f, xp, ups, isNew, kept, () => { this.state = 'ready'; }));
  },
  pause() {
    sfx('ok');
    const m = pushUI(new MenuUI({
      x: 100, y: 50, w: 120, lh: 14, rows: 8, title: this.L.name,
      items: [
        { label: 'Keep fishing', action: () => popUI(m) },
        { label: 'Change gear', action: () => { popUI(m); pushUI(new GearSelect(() => toast('Gear changed!'), 'Change gear')); } },
        { label: 'Status', action: () => pushUI(new MainMenu()) },
        { label: 'Save game', action: () => pushUI(new SlotUI('save', i => doSave(i))) },
        { label: 'Leave lake', action: () => { popUI(m); this.leave(() => setScene(LakeMapScene)); } },
        { label: 'Warp home', action: () => { popUI(m); this.leave(() => setScene(HomeScene, 10, 12, 'up')); sfx('warp'); } },
      ],
      onCancel: () => popUI(m),
    }));
  },
  leave(go) {
    G.day++;
    fadeTo(go);
    if (this.trip) setTimeout(() => toast('Day ' + G.day + ' begins. ' + this.trip + ' fish caught last trip!'), 600);
  },
  draw() {
    const bd = this.bd;
    ctx.drawImage(bd.back, 0, 0);
    const cx = -((T * 0.08) % 640);
    ctx.globalAlpha = bd.night ? 0.7 : 0.92; ctx.drawImage(bd.clouds, cx, 0); ctx.drawImage(bd.clouds, cx + 640, 0); ctx.globalAlpha = 1;
    ctx.drawImage(bd.mid, 0, 0);
    drawLakeWater(bd, T);
    if (this.L.id === 'marsh') for (let k = 0; k < 4; k++) { ctx.fillStyle = 'rgba(220,230,210,0.12)'; ctx.fillRect(((T * 0.2 * (k + 1)) % 480) - 160, 92 + k * 26, 160, 10); }
    ctx.drawImage(bd.fg, 0, 0);
    // shadows
    for (const s of this.shadows) { ctx.fillStyle = 'rgba(0,0,30,0.22)'; pellipse(s.x, s.y, 7 * s.s, 2 * s.s, 'rgba(0,0,30,0.22)'); rect(s.x + (s.vx > 0 ? -9 : 7) * s.s, s.y - 1, 2, 3, 'rgba(0,0,30,0.22)'); }
    // ripples & splash
    for (const r of this.rip) if (r.t > 0) pring(r.x, r.y + 2, r.t * 0.5 + 2, r.t * 0.18 + 1, `rgba(255,255,255,${0.8 - r.t / 50})`);
    for (const q of this.parts) rect(q.x, q.y, 1, 1, '#e8f8ff');
    // player
    const ps = playerSprites();
    const fr = this.state === 'reel' ? WALKSEQ[(T >> 2) % 4] : 0;
    const spr = ps.right[fr];
    ctx.drawImage(spr, 30, 84, spr.width * 2, spr.height * 2);
    const tip = this.tip();
    pline(60, 108, tip.x, tip.y, '#2a1a10', ctx, 2);
    pline(60, 108, tip.x, tip.y, RODS[G.player.rod].color);
    // line + bobber
    if (this.bob) {
      const b = this.bob; let by = b.y;
      if (this.state === 'wait') by += Math.sin(T / 12) + (this.nib > 0 ? (this.nib > 8 ? 2 : 1) : 0);
      if (this.state === 'bite') by += 3;
      let bx = b.x;
      if (this.state === 'reel') { bx += rnd(-1.5, 1.5); by += rnd(-1, 2); }
      const n = 24;
      for (let i = 0; i <= n; i++) {
        const t = i / n, sag = this.state === 'cast' ? 0 : Math.sin(t * Math.PI) * (this.state === 'reel' ? 2 : 10);
        rect(tip.x + (bx - tip.x) * t, tip.y + (by - tip.y) * t + sag, 1, 1, 'rgba(240,240,255,0.8)');
      }
      if (this.state === 'bite') {
        rect(bx - 2, by - 1, 5, 2, '#e83030');
        const jy = by - 20 - Math.abs(Math.sin(T / 3)) * 3;
        drawWin(bx - 7, jy - 3, 15, 15, 'gold'); text('!', bx - 2, jy + 1, '#ff5050');
        bar(bx - 12, jy + 14, 25, 3, 1 - this.bt / this.win, '#ffe060');
      } else if (this.state === 'reel') {
        pellipse(bx, by + 3, 6, 2, 'rgba(0,0,30,0.35)');
      } else {
        rect(bx - 2, by - 3, 5, 3, '#e83030'); rect(bx - 2, by, 5, 2, '#f8f8f8'); rect(bx, by - 5, 1, 2, '#303030');
      }
    }
    // HUD
    const p = G.player;
    drawWin(4, 4, 150, 42, 'dark');
    text(this.L.name, 12, 10, '#ffe890');
    const bname = p.bait && p.baits[p.bait] > 0 ? BAITS[p.bait].name + ' x' + p.baits[p.bait] : 'No bait';
    text(RODS[p.rod].name, 12, 21, '#c8d0f0'); text(bname, 12, 32, p.bait && p.baits[p.bait] > 0 ? '#c8d0f0' : '#ffb0b0');
    drawWin(244, 4, 72, 30, 'dark');
    text('Lv ' + p.level, 250, 10); textR(G.cooler.length + '/' + MAX_COOLER, 310, 10, G.cooler.length >= MAX_COOLER ? '#ff8080' : '#c8d0f0');
    bar(250, 23, 60, 3, p.level >= MAX_LEVEL ? 1 : p.xp / xpNeed(p.level), '#60e0a0');
    // power meter
    if (this.state === 'charge') {
      drawWin(16, 52, 72, 18, 'dark');
      const pw = this.pow, col = pw > 0.85 ? '#ff6060' : pw > 0.5 ? '#ffd040' : '#60e060';
      bar(22, 58, 60, 6, pw, col, '#202040');
      rect(22 + 51, 57, 1, 8, '#fff');
    }
    if (this.state === 'reel') this.drawBar();
    // message
    let m = '';
    switch (this.state) {
      case 'ready': m = 'A: Cast your line     B: Menu'; break;
      case 'charge': m = 'Press A to cast! Farther = deeper, rarer fish.'; break;
      case 'cast': m = 'Whoosh!'; break;
      case 'wait': m = this.nib > 0 ? '...a nibble? Wait for it...' : 'Waiting for a bite...   (A: reel in)'; break;
      case 'bite': m = '!!! A BITE !!!  Press A NOW!'; break;
      case 'reel': m = 'TAP A to lift the green bar. Keep the fish inside it!'; break;
      case 'msg': m = this.msg; break;
    }
    if (m && !ui.length) {
      const ls = wrap(m, 48);
      drawWin(4, H - 10 - ls.length * 11, 312, 8 + ls.length * 11);
      ls.forEach((l, i) => text(l, 12, H - 6 - ls.length * 11 + i * 11, this.state === 'bite' ? '#ffe890' : '#fff'));
    }
  },
  drawBar() {
    const r = this.r, x = 270, y = 34;
    drawWin(x, y, 42, BAR_H + 14, 'dark');
    const tx = x + 8, ty = y + 7;
    rect(tx, ty, 16, BAR_H, '#1a3a6a');
    for (let i = 0; i < BAR_H; i += 10) rect(tx, ty + i, 16, 1, '#24467a');
    const zc = r.inZone ? '#50e070' : '#3aa050';
    rect(tx + 1, ty + r.zy, 14, r.zh, zc); rect(tx + 1, ty + r.zy, 14, 1, '#c0ffc8'); rect(tx + 1, ty + r.zy + r.zh - 1, 14, 1, '#2a7a3a');
    // fish icon
    const fy = ty + r.fy, fx = tx + 3 + Math.round(Math.sin(T / 4));
    const fc = FISH[this.fishId].rare ? ((T >> 2) % 2 ? '#ffe040' : '#ff80c0') : '#ffd060';
    rect(fx, fy + 2, 7, 4, '#101028'); rect(fx + 1, fy + 2, 5, 4, fc); rect(fx + 7, fy + 1, 2, 6, fc); rect(fx + 2, fy + 3, 1, 1, '#101028');
    // progress
    const px = x + 30;
    rect(px, ty, 5, BAR_H, '#202040');
    const ph = Math.round(BAR_H * clamp(r.prog, 0, 100) / 100);
    rect(px, ty + BAR_H - ph, 5, ph, r.prog > 66 ? '#60e060' : r.prog > 33 ? '#f0d040' : '#f05050');
  },
};

// ============ Catch card ============
class CatchCard {
  constructor(f, xp, ups, isNew, kept, cb) { Object.assign(this, { f, xp, ups, isNew, kept, cb, age: 0, tapAnywhere: true }); }
  update() { this.age++; if (this.age > 25 && (inp.pressed.a || inp.pressed.b)) { sfx('ok'); popUI(this); this.cb(); } }
  draw() {
    const sp = FISH[this.f.id], x = 30, y = 26, w = 260, h = 186;
    drawWin(x, y, w, h, this.f.rare ? 'gold' : 'blue');
    const title = sp.junk ? 'You fished up...' : this.f.rare ? '*** RARE CATCH! ***' : 'You caught a fish!';
    textC(title, 160, y + 8, this.f.rare ? ((T >> 3) % 2 ? '#ffe890' : '#ff90d0') : '#ffe890');
    // sparkle bg
    rect(x + 60, y + 22, 140, 64, '#0c1238');
    for (let i = 0; i < 10; i++) { const a = T / 30 + i * 0.63; if ((T + i * 7) % 30 < 15) rect(160 + Math.cos(a) * 60, y + 54 + Math.sin(a) * 26, 1, 1, '#fff8c0'); }
    const img = fishSprite(this.f.id), s = Math.min(4, Math.floor(130 / img.width), Math.floor(58 / img.height));
    const bob = Math.round(Math.sin(this.age / 10) * 2);
    ctx.drawImage(img, 160 - img.width * s / 2, y + 54 - img.height * s / 2 + bob, img.width * s, img.height * s);
    textC(sp.name, 160, y + 94, this.f.rare ? '#ffe890' : '#fff');
    if (this.isNew && !sp.junk) { const nx = 160 + tw(sp.name) / 2 + 6; rect(nx, y + 92, 26, 11, '#e04848'); text('NEW', nx + 4, y + 94, '#fff', null); }
    text('Size', x + 40, y + 112, '#a8b8f0'); textR(this.f.size + ' cm', x + w - 40, y + 112);
    text('Value', x + 40, y + 125, '#a8b8f0'); textR('$' + fmt(this.f.value) + ' AC', x + w - 40, y + 125, '#ffe890');
    text('XP', x + 40, y + 138, '#a8b8f0'); textR('+' + this.xp, x + w - 40, y + 138, '#a8ffa8');
    if (this.ups) textC('LEVEL UP! You are now Lv ' + G.player.level + '!', 160, y + 154, (T >> 3) % 2 ? '#ffe890' : '#a8ffa8');
    else if (!this.kept) textC('Cooler full! You let it go...', 160, y + 154, '#ffb0b0');
    else if (sp.junk) textC(sp.desc, 160, y + 154, '#c8d0f0');
    if (this.age > 25) textC('Press A or tap', 160, y + 170, '#8898d0');
  }
}

<script>
// ---- js/main.js ----
'use strict';
// ============ Scene management ============
let scene = null, fade = null;
let newSlot = 0;
const AUTOSAVE_SCENES = ['city', 'home', 'lakemap', 'fishing'];
function setScene(s, ...args) {
  scene = s; if (s.enter) s.enter(...args);
  if (G && AUTOSAVE_SCENES.includes(s.id)) autosave();
}
// saves silently and shows a small "Saved" badge in the corner
let autosaveT = 0;
function autosave() {
  if (!G) return;
  if (scene && scene.saveLoc) scene.saveLoc();
  if (saveGame()) autosaveT = 110;
}
function drawAutosave() {
  if (autosaveT <= 0) return;
  autosaveT--;
  if (autosaveT > 100 || (autosaveT < 30 && (autosaveT >> 2) % 2)) return;
  const y = 50;
  drawWin(4, y, 58, 18, 'dark');
  const r = (T >> 3) % 4; rect(10, y + 6, 6, 6, '#80e0ff'); rect(11 + (r % 2) * 3, y + 7 + (r >> 1) * 3, 1, 1, '#101028');
  text('Saved', 20, y + 5, '#b0ffb0');
}
function fadeTo(fn, sp = 0.07) { if (fade) return; fade = { a: 0, d: 1, fn, sp }; }

// ============ Title ============
const TitleScene = {
  id: 'title',
  enter() {
    playSong('title');
    const ids = Object.keys(FISH).filter(k => !FISH[k].junk);
    this.fish = Array.from({ length: 9 }, (_, i) => ({ id: pick(ids), x: rnd(0, W), y: 120 + i * 12 + rnd(-4, 4), vx: rnd(0.2, 0.7) * (Math.random() < 0.5 ? -1 : 1) }));
    this.bub = Array.from({ length: 24 }, () => ({ x: rnd(0, W), y: rnd(0, H), s: rnd(0.3, 0.9) }));
    this.buildMenu();
    onSlotsChanged = () => { if (scene === TitleScene) this.buildMenu(); };
  },
  buildMenu() {
    const cont = hasSave();
    const start = i => {
      if (!loadGame(i)) { toast('Could not load that save!', '#ffb0b0'); return; }
      const l = G.loc || {};
      fadeTo(() => l.scene === 'home' ? setScene(HomeScene, l.x, l.y, l.dir) : setScene(CityScene, l.x ?? 15, l.y ?? 3, l.dir || 'down'));
    };
    const sel = this.menu ? this.menu.sel : (cont ? 0 : 1);
    this.menu = new Menu({
      x: 110, y: 120, w: 100, lh: 14, rows: 5, sel,
      items: [
        { label: 'Continue', disabled: !cont, why: 'No saved game yet.', action: () => start(latestSlot()) },
        { label: 'New Game', action: () => pushUI(new SlotUI('new', i => { newSlot = i; fadeTo(() => setScene(CharSelectScene)); })) },
        { label: 'Load Game', disabled: !cont, why: 'No saved game yet.', action: () => pushUI(new SlotUI('load', start)) },
        { label: 'Backup', action: () => pushUI(new BackupUI(() => this.buildMenu())) },
        { label: soundLabel(), action: it => { cycleSound(); it.label = soundLabel(); } },
      ],
    });
  },
  update() { this.menu.update(); },
  tick() {
    for (const f of this.fish) { f.x += f.vx; if (f.x < -40) f.x = W + 30; if (f.x > W + 40) f.x = -30; }
    for (const b of this.bub) { b.y -= b.s; b.x += Math.sin((T + b.y) / 20) * 0.2; if (b.y < -4) { b.y = H + 4; b.x = rnd(0, W); } }
  },
  draw() {
    for (let y = 0; y < H; y += 4) rect(0, y, W, 4, mix('#1a6ab8', '#081838', y / H));
    for (let i = 0; i < 5; i++) { ctx.fillStyle = 'rgba(180,230,255,0.06)'; const x = (i * 80 + T * 0.1) % 400 - 60; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 30, 0); ctx.lineTo(x + 90, H); ctx.lineTo(x + 40, H); ctx.fill(); }
    for (const f of this.fish) { const img = fishSprite(f.id, f.vx > 0); ctx.drawImage(img, Math.round(f.x), Math.round(f.y + Math.sin((T + f.y * 3) / 25) * 2)); }
    rect(0, H - 14, W, 14, '#c8b070'); rect(0, H - 14, W, 2, '#e8d49a');
    for (let x = 6; x < W; x += 22) for (let k = 0; k < 18; k += 2) rect(x + Math.round(Math.sin((T / 20) + k / 4 + x) * 2), H - 14 - k, 2, 2, '#2a8a4a');
    for (const b of this.bub) pring(b.x, b.y, 1.5, 1.5, 'rgba(220,240,255,0.7)');
    const bob = Math.round(Math.sin(T / 30) * 3);
    const sh = (T % 240) * 0.5 - 20;
    textLogo('AQUARIUM', 160 - 26 * 3 + 6, 34 + bob, 3, '#c8f8ff', '#2a8ad8', '#06183a', sh);
    textLogo('WORLD', 160 - 16 * 3 + 4, 70 + bob, 3, '#fff6a0', '#e87818', '#3a1404', sh - 10);
    textC('A pixel fishing adventure', 160, 108, '#c8e8ff');
    this.menu.draw(!ui.length);
    textC(saveStatusLine(), 160, 202, saveStatus === 'cloud' ? '#a8ffa8' : saveStatus === 'blocked' ? '#ff9090' : '#c8e8ff', '#081838');
    textC('Arrows/WASD move - Z/Enter OK - X back - Esc menu', 160, 214, '#8fb0e0', '#081838');
  },
};

// ============ Character select ============
const CharSelectScene = {
  id: 'charsel',
  enter() { this.sel = 0; playSong('title'); },
  update() {
    if (inp.pressed.left || inp.pressed.right) { this.sel = 1 - this.sel; sfx('blip'); }
    if (inp.pressed.a) {
      sfx('ok');
      const g = this.sel ? 'girl' : 'boy';
      pushUI(new NameEntry('Name your ' + g, g === 'boy' ? 'Kai' : 'Mia', 10, n => {
        newGame(g, n); curSlot = newSlot;
        fadeTo(() => setScene(WorldCreateScene));
      }));
    }
    if (inp.pressed.b) { sfx('cancel'); fadeTo(() => setScene(TitleScene)); }
  },
  tick() {},
  draw() {
    for (let y = 0; y < H; y += 4) rect(0, y, W, 4, mix('#2a4a9a', '#0a1430', y / H));
    textBig('CHOOSE YOUR ANGLER', 160 - 18 * 6 - 1, 18, 2, '#ffe890');
    const opts = [['boy', 'BOY', { hair: '#4a2a18', shirt: '#3070d0', pants: '#2c3458' }], ['girl', 'GIRL', { hair: '#b04060', shirt: '#f4f4f4', dress: '#e04878', ribbon: '#40c0e0', shoes: '#803040' }]];
    opts.forEach(([t, lab, col], i) => {
      const cx = 100 + i * 120, sel = this.sel === i;
      hit(cx - 50, 70, 100, 120, () => { if (this.sel === i) tapA(); else { this.sel = i; sfx('blip'); } });
      pellipse(cx, 160, 38, 9, sel ? '#f0c040' : '#3a4a7a'); pellipse(cx, 158, 36, 8, sel ? '#ffe890' : '#56679a');
      if (sel) for (let k = 0; k < 8; k++) { const a = T / 20 + k * 0.785; rect(cx + Math.cos(a) * 44, 110 + Math.sin(a) * 40, 2, 2, '#fff8c0'); }
      const s = charSprites(t, col), spr = sel ? s.down[WALKSEQ[(T >> 3) % 4]] : s.down[0];
      ctx.globalAlpha = sel ? 1 : 0.55;
      ctx.drawImage(spr, cx - 36, 84, spr.width * 4, spr.height * 4);
      ctx.globalAlpha = 1;
      textBig(lab, cx - tw(lab), 172, 2, sel ? '#ffe890' : '#8890b0');
      if (sel) drawCursor(cx - tw(lab) - 14, 177);
    });
    textC('Tap a character, then tap again to confirm', 160, 214, '#c8d0f0');
    btn(4, 4, 40, 16, 'Back', () => { inp.pressed.b = true; });
  },
};

// ============ World creation ============
const WorldCreateScene = {
  id: 'worldcreate',
  enter() {
    playSong('home');
    this.preview();
    say(['Every angler in Aquarium World owns a little world of their very own.', "Let's create yours! You can rename and customize it later at your house."], () => this.step1(), 'Guide');
  },
  preview() { this.field = buildHome(); this.field.place(10, 8, 'down'); this.field.noHud = true; },
  step1() { pushUI(new NameEntry('Name your world', G.world.name, 12, n => { G.world.name = n; this.preview(); this.step2(); })); },
  step2() { say('Choose a theme for ' + G.world.name + '.', () => themePicker(() => this.step3(), () => this.preview()), 'Guide'); },
  step3() { say('Now pick the color of your world flag.', () => flagPicker(() => this.step4(), () => this.preview()), 'Guide'); },
  step4() {
    ask('Create the world "' + G.world.name + '" (' + THEMES[G.world.theme].name + ')?', ['Create!', 'Start over'], k => {
      if (k !== 0) { this.step1(); return; }
      sfx('level');
      say(['Your world ' + G.world.name + ' has been created! It is small now, but you can grow it with aquariums, decorations and a bigger home.',
        'Now, a shimmering portal whisks you away to the bustling city of Aquarium World...'], () => {
        sfx('warp');
        fadeTo(() => setScene(CityScene, 15, 3, 'down'), 0.03);
      }, 'Guide');
    }, 'Guide');
  },
  update() {},
  tick() {},
  draw() {
    this.field.draw();
    drawWin(4, 4, 140, 18, 'dark'); text('Creating: ' + G.world.name, 10, 9, '#80e0ff');
  },
};

// SNES-style transition: the screen pixelates into big blocks while it darkens
let mosaicBuf = null;
function drawMosaicFade(a) {
  const block = 1 + Math.floor(a * 11);
  if (block > 1) {
    const w = Math.ceil(W / block), h = Math.ceil(H / block);
    if (!mosaicBuf || mosaicBuf.width !== w) mosaicBuf = mkCanvas(w, h);
    const mg = mosaicBuf.getContext('2d'); mg.imageSmoothingEnabled = false;
    mg.drawImage(cv, 0, 0, W, H, 0, 0, w, h);
    ctx.drawImage(mosaicBuf, 0, 0, w, h, 0, 0, w * block, h * block);
  }
  ctx.fillStyle = `rgba(0,0,0,${Math.pow(a, 1.6)})`; ctx.fillRect(0, 0, W, H);
}

// ============ Main loop ============
try { const s = JSON.parse(localStorage.getItem('aquariumWorldSound')); if (s) { soundOn = s[0]; musicOn = s[1]; } } catch (e) {}
function frame() {
  musicTick();
  if (fade) {
    fade.a += fade.d * fade.sp;
    pendingTap = null;
    if (fade.d === 1 && fade.a >= 1) { fade.a = 1; ui.length = 0; closeNameInput(); fade.fn(); fade.d = -1; }
    else if (fade.d === -1 && fade.a <= 0) fade = null;
  } else {
    processTap(() => {
      const top = ui[ui.length - 1];
      if (top) { if (top.tapAnywhere) tapA(); }
      else if (scene.id === 'fishing') holdA();
      else if (scene.field) tapA(); // talk / interact with what you face
    });
    if (ui.length) ui[ui.length - 1].update();
    else scene.update();
  }
  if (scene.tick && (!ui.length || scene.id === 'fishing' || scene.id === 'title')) scene.tick();
  hits.length = 0;
  scene.draw();
  ui.forEach((u, i) => { if (i === ui.length - 1) hits.length = 0; u.draw(); }); // only the top window takes taps
  drawToasts();
  drawAutosave();
  overlaysEndFrame();
  if (fade) drawMosaicFade(clamp(fade.a, 0, 1));
  inputEndFrame();
  T++;
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { frame(); acc -= 1000 / 60; n++; }
  requestAnimationFrame(loop);
}
initSaves();
// installed-app support: cache the game for offline play (only on a real web address, not inside claude.ai)
if ('serviceWorker' in navigator && window.top === window && !window.claude &&
    (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) toast('Update installed! Reopen the game to play it.', '#b0ffb0');
  });
}
setScene(TitleScene);
requestAnimationFrame(loop);

</script>
</body>
</html>
